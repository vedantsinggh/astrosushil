name: astro_mobile
description: Astro Sushil Mobile Application - Flutter Client
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  dio: ^5.4.3+1
  flutter_secure_storage: ^9.0.0
  intl: any
  pdf: ^3.10.8
  printing: ^5.13.1
  url_launcher: ^6.3.0
  razorpay_flutter: ^1.4.7
  google_sign_in: ^7.2.0
  firebase_core: ^5.2.0
  firebase_messaging: ^17.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/reports/covers/
    - assets/reports/illustrations/
    - assets/reports/shared/
