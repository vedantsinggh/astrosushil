name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend, engines, and API tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_password
          POSTGRES_DB: astro_sushil_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d astro_sushil_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres_password@localhost:5432/astro_sushil_test?schema=public
      TEST_DATABASE_URL: postgresql://postgres:postgres_password@localhost:5432/astro_sushil_test?schema=public
      JWT_SECRET: ci_only_test_secret_at_least_32_characters_long
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      LLM_PROVIDER: mock
      LATEX_COMPILER: local
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20.19.0
          cache: npm
      - name: Validate lockfile and install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npm run db:generate --workspace=apps/api
      - name: Validate Prisma schema and apply migrations to isolated CI database
        run: |
          npm exec --workspace=apps/api -- prisma validate
          npm exec --workspace=apps/api -- prisma migrate deploy
      - name: Build all TypeScript workspaces and API
        run: npm run build
      - name: Install PDF toolchain used by API report integration tests
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 texlive-xetex texlive-latex-extra texlive-fonts-recommended fonts-open-sans fonts-texgyre fonts-noto-core fontconfig ghostscript poppler-utils
      - name: Run API, payment-security, fulfillment, and queue suites
        run: npm run test --workspace=apps/api
      - name: Upload API JUnit report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: api-junit-report
          path: test-results/api.xml
          retention-days: 7

  report-regression:
    name: Report generation and PDF regressions
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20.19.0
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install deterministic PDF toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 texlive-xetex texlive-latex-extra texlive-fonts-recommended fonts-open-sans fonts-texgyre fonts-noto-core fontconfig ghostscript poppler-utils
      - name: Build internal packages
        run: npm run build:packages
      - name: Run report generation, PDF, and calculation integrity regressions
        run: npm run test:report --workspace=apps/api
      - name: Upload report JUnit report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: report-junit-report
          path: test-results/report.xml
          retention-days: 7

  astrology-regression:
    name: Astrology calculation fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20.19.0
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run astrology unit and determinism regressions
        run: npm run test --workspace=packages/astrology-engine
      - name: Upload astrology JUnit report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: astrology-junit-report
          path: test-results/astrology.xml
          retention-days: 7

  prediction-regression:
    name: Deterministic prediction and interpretation contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20.19.0
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Build internal packages
        run: npm run build:packages
      - name: Run deterministic evidence and provider contract tests
        run: npm run test:prediction --workspace=apps/api
      - name: Upload prediction JUnit report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: prediction-junit-report
          path: test-results/prediction.xml
          retention-days: 7

  mobile:
    name: Flutter analysis and tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Flutter
        uses: subosito/flutter-action@44ac965b96f18d999802d4b807e3256d5a3f9fa1
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true
      - name: Resolve locked Flutter dependencies
        run: flutter pub get --enforce-lockfile
      - name: Analyze Flutter application
        run: flutter analyze --no-pub --no-fatal-infos
      - name: Run Flutter unit and widget tests
        run: mkdir -p ../../test-results && flutter test --no-pub --exclude-tags ui_audit --machine > ../../test-results/mobile.json
      - name: Upload Flutter test diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: flutter-test-diagnostics
          path: test-results/mobile.json
          retention-days: 7

  frontend-and-containers:
    name: Admin build and Docker validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20.19.0
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Lint admin application
        run: npm run lint --workspace=apps/admin
      - name: Build admin application
        run: npm run build --workspace=apps/admin
      - name: Validate API, worker, and admin Docker builds
        run: |
          docker build --file apps/api/Dockerfile --tag astro-api:ci .
          docker build --file infrastructure/docker/Dockerfile.worker --tag astro-worker:ci .
          docker build --file apps/admin/Dockerfile --tag astro-admin:ci .
