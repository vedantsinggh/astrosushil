version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: astro_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
      POSTGRES_DB: astro_sushil
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: astro_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: astro_api
    restart: always
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres_password@postgres:5432/astro_sushil?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - postgres
      - redis

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    container_name: astro_admin
    restart: always
    ports:
      - "3001:3000"
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:3000
    depends_on:
      - api

  report-worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: astro_report_worker
    restart: always
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://postgres:postgres_password@postgres:5432/astro_sushil?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      LATEX_COMPILER: ${LATEX_COMPILER:-latexto}
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data:
  redis_data:
