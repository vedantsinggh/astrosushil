# Astro Sushil TESTING proxy (container: nginx:1.28.0-alpine, service testing-proxy).
#
# Mounted read-only as /etc/nginx/conf.d/default.conf. The official image's
# /etc/nginx/nginx.conf includes this file inside its `http {}` block, so every
# directive below is valid in http/server/location context only. The official
# nginx.conf already sets sendfile, keepalive_timeout, the `main` log format and
# logs to /var/log/nginx/*.log (symlinked to the container's stdout/stderr); those
# are not redefined here.
#
# Listeners (container ports; published by docker-compose.testing.yml):
#   8080  website origin   /      -> testing-website:80   (React SPA)
#                          /api/  -> testing-api:3000     (same origin, path kept)
#   8081  admin origin     /      -> testing-admin:3000   (Next.js)
#                          /api/  -> testing-api:3000     (same origin, path kept)
#   8082  API-only origin  /      -> testing-api:3000     (mobile app, webhooks)
#
# Each server includes a GENERATED file from /etc/nginx/testing (render-proxy-access.sh):
#   access-website.conf, access-admin.conf, access-api.conf
# They hold only server-context directives: set_real_ip_from / real_ip_header /
# real_ip_recursive, allow / deny, and (website + admin only) auth_basic +
# auth_basic_user_file /etc/nginx/testing/htpasswd. A missing file makes nginx
# refuse to start (fail closed). See infrastructure/testing/docs/public-access.md.
#
# TLS is terminated upstream of this container (host Caddy/Nginx or a Cloudflare
# tunnel). This proxy therefore never sends HSTS and never redirects to HTTPS.

server_tokens off;
# Keep relative Location headers relative. Otherwise nginx would turn them into
# absolute URLs with this container's internal port (8080/8081/8082) and scheme.
absolute_redirect off;

# Docker's embedded DNS. Upstreams are resolved at request time (proxy_pass with a
# variable), so nginx starts and keeps running while an upstream container is
# restarting; such requests get a 502 instead of the proxy crash-looping.
resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;

# ---------------------------------------------------------------- maps / geo ---

# Was the TCP peer (before real-IP rewriting) a private/loopback address, i.e. the
# host reverse proxy reaching us through Docker's port publishing (source = the
# docker network gateway), or a tunnel container on testing_edge? Public clients
# hitting the raw published port keep their public source address (DNAT), so they
# cannot make us believe they used HTTPS.
geo $realip_remote_addr $testing_peer_is_private {
    default         0;
    127.0.0.0/8     1;
    10.0.0.0/8      1;
    172.16.0.0/12   1;
    192.168.0.0/16  1;
    ::1             1;
    fc00::/7        1;
}

# X-Forwarded-Proto sent to upstreams: trust the incoming value only from a
# private peer and only if it is exactly http or https; otherwise our own scheme.
map "$testing_peer_is_private:$http_x_forwarded_proto" $testing_forwarded_proto {
    default     $scheme;
    "1:https"   https;
    "1:http"    http;
}

# Browsers that passed HTTP basic auth on the website/admin origin send
# "Authorization: Basic ..." on every same-origin request, including /api/.
# The API would treat that as a (broken) credential, so it is blanked; Bearer
# tokens and anything else pass through unchanged. An empty value means nginx
# does not send the header at all.
map $http_authorization $testing_authorization_without_basic {
    default         $http_authorization;
    "~*^Basic\s"    "";
}

# Request-id correlation: pass the client's x-request-id only if it matches the
# API's own rule /^[a-zA-Z0-9_-]{8,64}$/; otherwise (absent or invalid) use
# nginx's 32-hex $request_id, so proxy and API logs always share one id.
map $http_x_request_id $testing_request_id {
    default                     $request_id;
    "~^[a-zA-Z0-9_-]{8,64}$"    $http_x_request_id;
}

# WebSocket upgrade support. No API endpoint uses WebSockets or SSE today; this
# keeps a future one working without a proxy change.
map $http_upgrade $testing_connection_upgrade {
    default     upgrade;
    ""          "";
}

# ------------------------------------------------------------------ logging ---

# realip=  TCP peer before real-IP rewriting (host proxy / docker gateway)
# client=  $remote_addr after real-IP rewriting (the address allow/deny saw)
log_format testing_main '$remote_addr - $remote_user [$time_local] "$request" '
                        '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                        'xff="$http_x_forwarded_for" realip="$realip_remote_addr" '
                        'host="$http_host" rid="$testing_request_id" '
                        'rt=$request_time urt="$upstream_response_time" ups="$upstream_addr"';

# ------------------------------------------------------------ compression ---

gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/plain text/css text/xml text/javascript application/javascript
           application/json application/xml application/manifest+json
           image/svg+xml font/ttf font/otf;

# ------------------------------------------------- shared proxy behaviour ---
# Defined once here and inherited by every proxying location. No location below
# sets proxy_set_header or proxy_hide_header itself (that would drop all of the
# inherited ones); per-location differences go through variables instead.

proxy_http_version 1.1;
proxy_redirect off;
proxy_set_header Host               $http_host;
proxy_set_header X-Real-IP          $remote_addr;
# Exactly one hop: the client address as resolved by the real-IP rules. Never the
# raw incoming chain, so an untrusted client cannot spoof its address to the API.
proxy_set_header X-Forwarded-For    $remote_addr;
proxy_set_header X-Forwarded-Proto  $testing_forwarded_proto;
proxy_set_header X-Forwarded-Host   $http_host;
proxy_set_header X-Request-Id       $testing_request_id;
proxy_set_header Authorization      $testing_upstream_authorization;
proxy_set_header Upgrade            $http_upgrade;
proxy_set_header Connection         $testing_connection_upgrade;
# Origin, Cookie, X-CSRF-Token, X-Auth-Scope and all other headers pass unchanged.
# Set-Cookie passes unchanged: with AUTH_COOKIE_DOMAIN unset the API issues
# host-only cookies for the origin the browser is on, which is what we want.

proxy_hide_header X-Powered-By;
# Set by this proxy for every response (see add_header below); hiding the
# upstream copies (helmet on the API) avoids duplicate headers.
proxy_hide_header X-Frame-Options;
proxy_hide_header X-Content-Type-Options;

proxy_connect_timeout 10s;
proxy_send_timeout    60s;
proxy_read_timeout    60s;
proxy_buffering on;
proxy_buffers 16 16k;
proxy_buffer_size 16k;

# =============================================================== website ===
server {
    listen 8080 default_server;
    server_name _;

    include /etc/nginx/testing/access-website.conf;

    access_log /var/log/nginx/access.log testing_main;

    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    client_max_body_size 2m;

    # Frontend upstreams never need the visitor's basic-auth credentials.
    set $testing_upstream_authorization "";

    location = /healthz {
        auth_basic off;
        allow all;
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /robots.txt {
        auth_basic off;
        allow all;
        access_log off;
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location /api/ {
        set $testing_upstream_authorization $testing_authorization_without_basic;
        set $testing_api_upstream http://testing-api:3000;
        # Variable without a URI part: the original request URI (/api/...) is
        # passed unchanged.
        proxy_pass $testing_api_upstream;

        # Uploads (API multipart ceiling MAX_UPLOAD_BYTES = 50 MiB) plus headroom.
        client_max_body_size 55m;
        # On-demand PDF rendering and CSV/GST exports can take minutes.
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        error_page 502 503 504 = @api_unavailable;
        error_page 413 = @api_too_large;
    }

    location / {
        set $testing_website_upstream http://testing-website:80;
        proxy_pass $testing_website_upstream;
        # The SPA container's own nginx builds absolute redirects with its
        # internal port/scheme (directory slash redirects); make them relative.
        proxy_redirect ~^https?://[^/]+(/.*)$ $1;
        error_page 502 503 504 = @frontend_unavailable;
    }

    location @api_unavailable {
        default_type application/json;
        return 502 '{"error":{"code":"UPSTREAM_UNAVAILABLE","message":"The testing API is not reachable right now.","requestId":"$testing_request_id"}}';
    }

    location @api_too_large {
        default_type application/json;
        return 413 '{"error":{"code":"PAYLOAD_TOO_LARGE","message":"Request body is too large.","requestId":"$testing_request_id"}}';
    }

    location @frontend_unavailable {
        default_type text/plain;
        return 502 "Testing website is starting or unavailable. Retry in a minute.\n";
    }
}

# ================================================================= admin ===
server {
    listen 8081 default_server;
    server_name _;

    include /etc/nginx/testing/access-admin.conf;

    access_log /var/log/nginx/access.log testing_main;

    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    client_max_body_size 2m;

    set $testing_upstream_authorization "";

    location = /healthz {
        auth_basic off;
        allow all;
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /robots.txt {
        auth_basic off;
        allow all;
        access_log off;
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location /api/ {
        set $testing_upstream_authorization $testing_authorization_without_basic;
        set $testing_api_upstream http://testing-api:3000;
        proxy_pass $testing_api_upstream;

        client_max_body_size 55m;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        error_page 502 503 504 = @api_unavailable;
        error_page 413 = @api_too_large;
    }

    # Next.js (standalone server). /_next/static/* already carries immutable
    # Cache-Control from Next itself, so no extra caching rules are needed.
    location / {
        set $testing_admin_upstream http://testing-admin:3000;
        proxy_pass $testing_admin_upstream;
        error_page 502 503 504 = @frontend_unavailable;
    }

    location @api_unavailable {
        default_type application/json;
        return 502 '{"error":{"code":"UPSTREAM_UNAVAILABLE","message":"The testing API is not reachable right now.","requestId":"$testing_request_id"}}';
    }

    location @api_too_large {
        default_type application/json;
        return 413 '{"error":{"code":"PAYLOAD_TOO_LARGE","message":"Request body is too large.","requestId":"$testing_request_id"}}';
    }

    location @frontend_unavailable {
        default_type text/plain;
        return 502 "Testing admin is starting or unavailable. Retry in a minute.\n";
    }
}

# ============================================================== API-only ===
# Used by the mobile app and by provider webhooks. No basic auth here (the app
# and webhook senders cannot do it); access-api.conf may still hold an allowlist.
server {
    listen 8082 default_server;
    server_name _;

    include /etc/nginx/testing/access-api.conf;

    access_log /var/log/nginx/access.log testing_main;

    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    client_max_body_size 55m;

    # No basic auth on this origin: whatever Authorization the client sends
    # (Bearer from the mobile app) passes through.
    set $testing_upstream_authorization $http_authorization;

    location = /healthz {
        allow all;
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /robots.txt {
        allow all;
        access_log off;
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location / {
        set $testing_api_upstream http://testing-api:3000;
        proxy_pass $testing_api_upstream;

        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        error_page 502 503 504 = @api_unavailable;
        error_page 413 = @api_too_large;
    }

    location @api_unavailable {
        default_type application/json;
        return 502 '{"error":{"code":"UPSTREAM_UNAVAILABLE","message":"The testing API is not reachable right now.","requestId":"$testing_request_id"}}';
    }

    location @api_too_large {
        default_type application/json;
        return 413 '{"error":{"code":"PAYLOAD_TOO_LARGE","message":"Request body is too large.","requestId":"$testing_request_id"}}';
    }
}
